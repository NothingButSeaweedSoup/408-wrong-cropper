<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>408 错题本</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<!-- 登录门：不登录看不到题目/导出/得分 -->
<div id="gate" class="gate hidden">
  <div class="gate-card">
    <h1>408 错题本</h1>
    <p class="hint" id="gateHint">登录后即可看题、勾选错题、生成 Word，并保存自己的得分记录。</p>
    <div class="chip-row">
      <button id="authTabLogin" class="chip active">登录</button>
      <button id="authTabRegister" class="chip">注册</button>
    </div>
    <input id="authUser" class="input" placeholder="用户名" autocomplete="username" />
    <input id="authPass" class="input" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password" />
    <input id="authName" class="input hidden" placeholder="昵称（可选）" />
    <button id="authSubmit" class="btn primary">登录</button>
    <p id="authMsg" class="hint err-text"></p>
  </div>
</div>

<div id="shell" class="hidden">
  <header class="topbar">
    <h1>408 错题本</h1>
    <nav class="tabs">
      <button class="tab active" data-view="pick">选错题</button>
      <button class="tab" data-view="scores">得分</button>
    </nav>
  </header>

  <main>
    <!-- 选错题 -->
    <section id="view-pick" class="view">
      <div class="filters">
        <div class="row pick-row">
          <label class="pick-field">
            <span class="pick-label">真题年份</span>
            <select id="yearSelect" class="input">
              <option value="">请选择</option>
            </select>
          </label>
          <label class="pick-field">
            <span class="pick-label">科目</span>
            <select id="subjectSelect" class="input">
              <option value="">请选择</option>
            </select>
          </label>
        </div>
        <div class="row">
          <input id="keyword" class="input" type="search" placeholder="搜索年份 / 题号" />
          <button id="selectAll" class="btn ghost">全选当前</button>
          <button id="clearAll" class="btn ghost">清空</button>
        </div>
        <details class="options">
          <summary>导出选项</summary>
          <label><input type="checkbox" id="optCaption" /> 每题显示一行标题（年份 + 题号）</label>
          <label>答题留白行数 <input type="number" id="optNote" min="0" max="20" value="0" /></label>
          <label>图片宽度(cm) <input type="number" id="optWidth" min="8" max="17" step="0.5" value="16" /></label>
        </details>
      </div>

      <p id="pickLoading" class="hint hidden">正在加载这一年的题目…</p>
      <div id="questionList" class="grid"></div>
      <p id="pickEmpty" class="empty">还没有真题数据，请先在管理后台导入真题 PDF。</p>
    </section>

    <!-- 得分记录与趋势 -->
    <section id="view-scores" class="view hidden">
      <div id="scoreApp">
        <div class="card userbar">
          <span id="whoami" class="who"></span>
          <span class="spacer"></span>
          <button id="newRecord" class="btn primary">录入成绩</button>
          <button id="logoutBtn" class="btn ghost">退出</button>
        </div>

        <div id="recordForm" class="card hidden"></div>

        <div class="card">
          <div class="chart-head">
            <strong>得分趋势</strong>
            <span class="spacer"></span>
            <select id="xAxis" class="input sm">
              <option value="practice_date">按做题时间</option>
              <option value="paper_year">按真题年份</option>
            </select>
            <select id="aggregate" class="input sm hidden">
              <option value="latest">同年取最近一次</option>
              <option value="avg">同年取平均</option>
              <option value="max">同年取最高</option>
            </select>
          </div>
          <div id="estimate" class="estimate"></div>
          <div id="chart"></div>
        </div>

        <div class="card">
          <h2>成绩记录</h2>
          <div id="recordList" class="records"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="bottombar">
    <button id="selInfo" class="sel-info empty">已选 0 题</button>
    <button id="exportBtn" class="btn primary" disabled>生成 Word 错题本</button>
  </footer>
</div>

<div id="toast" class="toast hidden"></div>

<!-- 已选题目清单：点底栏「已选 n 题」弹出，可逐条删除 / 一键删除 -->
<div id="selPanel" class="dl-panel hidden">
  <div class="dl-head">
    <strong id="selTitle">已选 0 题</strong>
    <span class="spacer"></span>
    <button id="selClear" class="btn tiny danger" disabled>一键删除</button>
    <button id="selClose" class="btn tiny ghost">关闭</button>
  </div>
  <div id="selList" class="sel-list"></div>
  <p class="hint" id="selHint">勾选**跨年份**累计；导出时按年份、题号排序。点每条右边的 ✕ 删掉这一题。</p>
</div>

<!-- 下载链接面板：手机端（WebView / 手机浏览器）下载最不靠谱，干脆把临时链接给你复制 -->
<div id="dlPanel" class="dl-panel hidden">
  <div class="dl-head">
    <strong>下载链接（15 分钟内有效）</strong>
    <button id="dlClose" class="btn tiny ghost">关闭</button>
  </div>
  <input id="dlUrl" class="input dl-url" readonly />
  <div class="dl-actions">
    <button id="dlCopy" class="btn primary">复制链接</button>
    <button id="dlOpen" class="btn">直接用浏览器打开</button>
  </div>
  <p class="hint" id="dlHint">复制后粘到任意浏览器地址栏就能下载（手机上没有下载动作时，把链接发到电脑上也行）。</p>
</div>

<script src="/core.js"></script>
<script src="/chart.js"></script>
<script src="/app.js"></script>
<script src="/scores.js"></script>
</body>
</html>
